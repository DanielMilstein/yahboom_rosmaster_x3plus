# Yahboom ROSMaster X3 Plus servo ID map.
#
# CALIBRATED 2026-07-03. The arm's UART bus servos travel 0-180 deg with
# 90 deg = joint zero, so each joint spans -pi/2..+pi/2 rad. The earlier
# placeholder values mapped the URDF's fictional +/-2 / +/-2.5 rad limits
# onto 0-180 deg, which silently scaled every commanded angle down to
# ~79% (joints 1-2) / ~63% (joints 3-4) of the requested motion — and the
# readback inverted through the same wrong map, so /joint_states reported
# the commanded value while the physical arm under-articulated (grasp
# landed high and short; caught by FK-vs-tape comparison on hardware).
#
# Each joint maps to:
#   id:           UART servo ID on the STM32 bus
#   open_rad:     joint value (rad) corresponding to servo_angle=0 deg
#   close_rad:    joint value (rad) corresponding to servo_angle=180 deg
#   invert:       reverse the mapping direction (true/false)
#
# The arm_action_server and gripper_action_server will linearly remap
# trajectory points in radians to the servo's 0–180 deg range using
# these limits.

joints:
  arm_joint1:
    id: 1
    open_rad: -1.5708
    close_rad: 1.5708
    invert: false
  arm_joint2:
    id: 2
    open_rad: -1.5708
    close_rad: 1.5708
    invert: false
  arm_joint3:
    id: 3
    open_rad: -1.5708
    close_rad: 1.5708
    invert: false
  arm_joint4:
    id: 4
    open_rad: -1.5708
    close_rad: 1.5708
    invert: false
  arm_joint5:
    id: 5
    open_rad: -1.5708
    close_rad: 1.5708
    invert: false
  grip_joint:
    id: 6
    open_rad: -1.54
    close_rad: 0.0
    invert: false
